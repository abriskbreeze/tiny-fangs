<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tiny Fangs — DOM/Three Compositing Spike</title>
  <style>
    html, body { margin: 0; padding: 0; background: #1c221b; overflow: hidden; }
    #stage { position: relative; width: 1672px; height: 941px; transform-origin: 0 0; }
    #scene-canvas { position: absolute; inset: 0; display: block; }
    .dom-card {
      position: absolute; left: 0; top: 0;
      background: rgba(236, 226, 205, 0.92);
      border: 2px solid #7a6f58; box-sizing: border-box;
      color: #4a4237; font: 700 20px/1.2 sans-serif;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .fiducial { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      background: #d8412f; border-radius: 50%; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="scene-canvas" width="1672" height="941"></canvas>
    <div id="dom-layer"></div>
  </div>
  <script type="module" src="/src/presentation/scene/composite-page.js"></script>
</body>
</html>
