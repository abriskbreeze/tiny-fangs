      margin: 0 0 10px 0;

    .demo pre {
      background: #0d0d15;
      padding: 20px;
      border-radius: 4px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      font-size: 11px;
      margin: 0;
      transition: transform 0.1s;

      border: 1px solid #555;

      border-radius: 4px;

// Generate animation frames for a style (same sequence as game)
function generateFrames(style, result) {
  const s = styles[style];
  return [
    // Rise phase (getting bigger)
    { art: s.small.edge, delay: 80 },
    { art: s.med.heads, delay: 80 },
    { art: s.med.edge, delay: 60 },
    { art: s.big.tails, delay: 60 },
    { art: s.big.edge, delay: 50 },
    { art: s.big.heads, delay: 50 },
    { art: s.big.edge, delay: 50 },
    { art: s.big.tails, delay: 50 },
    { art: s.big.edge, delay: 50 },
    { art: s.big.heads, delay: 50 },
    // Fall phase (getting smaller)
    { art: s.big.edge, delay: 50 },
    { art: s.med.tails, delay: 60 },
    { art: s.med.edge, delay: 60 },
    { art: s.med.heads, delay: 70 },
    { art: s.small.edge, delay: 80 },
    // Bounce 1
    { art: s.med[result], delay: 100, bounce: true },
    { art: s.small.edge, delay: 80 },
    // Bounce 2 (smaller)
    { art: s.small[result], delay: 120, bounce: true },
    { art: s.small.edge, delay: 60 },
    // Final land
    { art: s.small[result], delay: 600 },
  ];
}

// Create demo grid
const grid = document.getElementById('grid');

for (const name of Object.keys(styles)) {
  const demo = document.createElement('div');
  demo.className = 'demo';
  demo.innerHTML = `
    <h3>${name}</h3>
    <pre id="coin-${name}"></pre>
    <div class="controls">
      <button onclick="restartAnim('${name}')">Restart</button>
    </div>
  `;
  grid.appendChild(demo);
}

// Animation runners
const animStates = {};

async function runAnim(name) {
  const el = document.getElementById(`coin-${name}`);
  animStates[name] = true;
  
  while (animStates[name]) {
    const result = Math.random() < 0.5 ? 'heads' : 'tails';
    const frames = generateFrames(name, result);
    
    for (const frame of frames) {
      if (!animStates[name]) break;
      el.textContent = frame.art;
      if (frame.bounce) {
        el.style.transform = 'translateY(-15px)';
        await new Promise(r => setTimeout(r, 60));
        el.style.transform = 'translateY(0)';
      }
      await new Promise(r => setTimeout(r, frame.delay));
    }
    // Pause before loop
    await new Promise(r => setTimeout(r, 800));
  }
}

function restartAnim(name) {
  animStates[name] = false;
  setTimeout(() => runAnim(name), 100);
}

// Start all
for (const name of Object.keys(styles)) {
  runAnim(name);
}
