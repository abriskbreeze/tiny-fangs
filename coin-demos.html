      transition: transform 0.08s ease-out;

      border: 1px solid #555;

      cursor: pointer;
      border-radius: 4px;

// Font sizes for each scale
const fontSizes = {
  small: '10px',
  med: '14px',
  big: '18px'
};

// Generate animation frames for a style (same sequence as game)
function generateFrames(style, result) {
  const s = styles[style];
  return [
    // Rise phase (getting bigger) - with font scaling
    { art: s.small.edge, size: 'small', delay: 80 },
    { art: s.med.heads, size: 'med', delay: 80 },
    { art: s.med.edge, size: 'med', delay: 60 },
    { art: s.big.tails, size: 'big', delay: 60 },
    { art: s.big.edge, size: 'big', delay: 50 },
    { art: s.big.heads, size: 'big', delay: 50 },
    { art: s.big.edge, size: 'big', delay: 50 },
    { art: s.big.tails, size: 'big', delay: 50 },
    { art: s.big.edge, size: 'big', delay: 50 },
    { art: s.big.heads, size: 'big', delay: 50 },
    // Fall phase (getting smaller)
    { art: s.big.edge, size: 'big', delay: 50 },
    { art: s.med.tails, size: 'med', delay: 60 },
    { art: s.med.edge, size: 'med', delay: 60 },
    { art: s.med.heads, size: 'med', delay: 70 },
    { art: s.small.edge, size: 'small', delay: 80 },
    // Bounce 1
    { art: s.med[result], size: 'med', delay: 100, bounce: true },
    { art: s.small.edge, size: 'small', delay: 80 },
    // Bounce 2 (smaller)
    { art: s.small[result], size: 'small', delay: 120, bounce: true },
    { art: s.small.edge, size: 'small', delay: 60 },
    // Final land
    { art: s.small[result], size: 'small', delay: 800 },
  ];
}

// Create demo grid
const grid = document.getElementById('grid');

for (const name of Object.keys(styles)) {
  const demo = document.createElement('div');
  demo.className = 'demo';
  demo.innerHTML = `
    <h3>${name}</h3>
    <div class="coin-container">
      <pre id="coin-${name}"></pre>
    </div>
    <div class="controls">
      <button onclick="restartAnim('${name}')">Restart</button>
    </div>
  `;
  grid.appendChild(demo);
}

// Animation runners
const animStates = {};

async function runAnim(name) {
  const el = document.getElementById(`coin-${name}`);
  animStates[name] = true;
  
  while (animStates[name]) {
    const result = Math.random() < 0.5 ? 'heads' : 'tails';
    const frames = generateFrames(name, result);
    
    for (const frame of frames) {
      if (!animStates[name]) break;
      el.textContent = frame.art;
      el.style.fontSize = fontSizes[frame.size];
      
      if (frame.bounce) {
        el.style.transform = 'translateY(-20px)';
        await new Promise(r => setTimeout(r, 60));
        el.style.transform = 'translateY(0)';
      }
      await new Promise(r => setTimeout(r, frame.delay));
    }
    // Pause before loop
    await new Promise(r => setTimeout(r, 500));
  }
}

function restartAnim(name) {
  animStates[name] = false;
  setTimeout(() => runAnim(name), 100);
}

// Start all
for (const name of Object.keys(styles)) {
  runAnim(name);
}
