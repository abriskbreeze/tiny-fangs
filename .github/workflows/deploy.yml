name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install multiplayer server dependencies
        run: npm --prefix server ci

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test -- --run

      - name: Multiplayer server process tests
        run: npm run test:server-process

      - name: Production build
        run: npm run build

      - name: Browser smoke
        run: npm run test:e2e

      - name: Multiplayer smoke
        run: npm run test:multiplayer

      - name: Visual smoke
        run: npm run test:visual

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            artifacts/visual/
            !artifacts/visual/blind-mappings/**

      # enablement: true creates the Pages site on first run if missing
      # (fixes HttpError Not Found / Get Pages site failed)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
