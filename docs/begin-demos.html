<!DOCTYPE html>
<html>
<head>
  <title>BEGIN! Animation Demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #ffd700; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .demo {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .demo h3 {
      color: #ffd700;
      margin: 0 0 10px 0;
    }
    .stage {
      background: #0d0d15;
      padding: 30px;
      border-radius: 4px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .demo pre {
      color: #ffd700;
      margin: 0;
      font-size: 14px;
      white-space: pre;
      line-height: 1.2;
    }
    .controls {
      margin-top: 10px;
    }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 5px 15px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>BEGIN! Animation Demos (Vertical Cut Variants)</h1>
  <p style="text-align:center;color:#888;">6 based on Vertical Cut + 6 variations</p>
  <div class="grid" id="grid"></div>

<script>
const animations = {
  "1. Vertical Cut (Original)": {
    frames: [
      { text: "        │\n        │\n        │\n        │\n        │", delay: 60 },
      { text: "        │\n        │\n   ─────┼─────\n        │\n        │", delay: 60 },
      { text: "        │\n   ─────┼─────\n   BEGIN!\n   ─────┼─────\n        │", delay: 80 },
      { text: "   ─────┼─────\n   BEGIN!\n   ─────┼─────", delay: 80 },
      { text: "\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "2. Double Vertical": {
    frames: [
      { text: "     │     │\n     │     │\n     │     │\n     │     │\n     │     │", delay: 60 },
      { text: "     │     │\n     │     │\n─────┼─────┼─────\n     │     │\n     │     │", delay: 60 },
      { text: "     │     │\n─────┼─────┼─────\n   BEGIN!\n─────┼─────┼─────\n     │     │", delay: 80 },
      { text: "─────┼─────┼─────\n   BEGIN!\n─────┼─────┼─────", delay: 80 },
      { text: "\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "3. Cross Expand": {
    frames: [
      { text: "        ┼", delay: 50 },
      { text: "        │\n   ─────┼─────\n        │", delay: 50 },
      { text: "        │\n        │\n   ─────┼─────\n        │\n        │", delay: 50 },
      { text: "        │\n        │\n        │\n───────┼───────\n        │\n        │\n        │", delay: 60 },
      { text: "        │\n   ────┼────\n   BEGIN!\n   ────┼────\n        │", delay: 80 },
      { text: "\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "4. Grid Slice": {
    frames: [
      { text: "  │   │   │\n──┼───┼───┼──\n  │   │   │\n──┼───┼───┼──\n  │   │   │", delay: 80 },
      { text: "  │   │   │\n──┼───┼───┼──\n  │ B │   │\n──┼───┼───┼──\n  │   │   │", delay: 60 },
      { text: "  │   │   │\n──┼───┼───┼──\n  │BEGIN!│\n──┼───┼───┼──\n  │   │   │", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "5. Descending Cut": {
    frames: [
      { text: "───────────────\n        │", delay: 50 },
      { text: "───────────────\n        │\n        │", delay: 50 },
      { text: "───────────────\n        │\n        │\n        │", delay: 50 },
      { text: "───────────────\n        │\n   BEGIN!\n        │\n───────────────", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "6. Closing Gate": {
    frames: [
      { text: "│             │\n│             │\n│             │\n│             │\n│             │", delay: 60 },
      { text: " │           │\n │           │\n │           │\n │           │\n │           │", delay: 50 },
      { text: "  │         │\n  │         │\n  │         │\n  │         │\n  │         │", delay: 50 },
      { text: "   │       │\n   │       │\n───┼───────┼───\n   │       │\n   │       │", delay: 60 },
      { text: "    │     │\n────┼─────┼────\n   BEGIN!\n────┼─────┼────\n    │     │", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "7. Triple Horizontal": {
    frames: [
      { text: "        │\n        │\n        │\n        │\n        │", delay: 60 },
      { text: "────────┼────────\n        │\n        │\n        │\n────────┼────────", delay: 60 },
      { text: "────────┼────────\n        │\n────────┼────────\n        │\n────────┼────────", delay: 60 },
      { text: "────────┼────────\n   BEGIN!\n────────┼────────", delay: 80 },
      { text: "\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "8. Box Form": {
    frames: [
      { text: "        │\n        │\n        │", delay: 50 },
      { text: "   ─────┼─────\n        │\n   ─────┼─────", delay: 50 },
      { text: "   ┌────┼────┐\n   │    │    │\n   └────┼────┘", delay: 50 },
      { text: "   ┌─────────┐\n   │ BEGIN! │\n   └─────────┘", delay: 80 },
      { text: "\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "9. Stab Through": {
    frames: [
      { text: "                 ─", delay: 40 },
      { text: "              ───", delay: 40 },
      { text: "           ──────", delay: 40 },
      { text: "        ─────────", delay: 40 },
      { text: "     ────────────", delay: 40 },
      { text: "  ───────────────", delay: 40 },
      { text: "─────────────────\n        │", delay: 50 },
      { text: "─────────────────\n        │\n   BEGIN!\n        │\n─────────────────", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "10. Pulse Cross": {
    frames: [
      { text: "   ┼", delay: 50 },
      { text: "   │\n ──┼──\n   │", delay: 50 },
      { text: "    │\n    │\n ───┼───\n    │\n    │", delay: 50 },
      { text: "     │\n     │\n     │\n ────┼────\n     │\n     │\n     │", delay: 60 },
      { text: "      │\n      │\n ─────┼─────\n  BEGIN!\n ─────┼─────\n      │\n      │", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "11. Zipper": {
    frames: [
      { text: "─┬─────────────┬─\n │             │\n │             │\n │             │\n─┴─────────────┴─", delay: 70 },
      { text: "──┬───────────┬──\n  │           │\n  │           │\n  │           │\n──┴───────────┴──", delay: 60 },
      { text: "───┬─────────┬───\n   │         │\n   │         │\n   │         │\n───┴─────────┴───", delay: 60 },
      { text: "────┬───────┬────\n    │       │\n    │BEGIN! │\n    │       │\n────┴───────┴────", delay: 70 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "12. Rising Blade": {
    frames: [
      { text: "\n\n\n\n─────────────────", delay: 50 },
      { text: "\n\n\n        │\n────────┼────────", delay: 50 },
      { text: "\n\n        │\n        │\n────────┼────────", delay: 50 },
      { text: "\n        │\n        │\n        │\n────────┼────────", delay: 50 },
      { text: "        │\n        │\n   BEGIN!\n        │\n────────┼────────", delay: 70 },
      { text: "────────┼────────\n        │\n   BEGIN!\n        │\n────────┼────────", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },
};

// Create demo grid
const grid = document.getElementById('grid');

for (const [name, anim] of Object.entries(animations)) {
  const demo = document.createElement('div');
  demo.className = 'demo';
  demo.innerHTML = `
    <h3>${name}</h3>
    <div class="stage">
      <pre id="anim-${name}"></pre>
    </div>
    <div class="controls">
      <button onclick="restartAnim('${name}')">Replay</button>
    </div>
  `;
  grid.appendChild(demo);
}

// Animation runners
const animStates = {};

async function runAnim(name) {
  const anim = animations[name];
  const el = document.getElementById(`anim-${name}`);
  animStates[name] = true;
  
  while (animStates[name]) {
    for (const frame of anim.frames) {
      if (!animStates[name]) break;
      el.textContent = frame.text;
      el.style.transform = `scale(${frame.scale || 1})`;
      el.style.transition = frame.scale ? 'transform 0.15s ease-out' : 'none';
      await new Promise(r => setTimeout(r, frame.delay));
    }
    // Reset and pause before loop
    await new Promise(r => setTimeout(r, 1000));
    el.style.transform = 'scale(1)';
  }
}

function restartAnim(name) {
  animStates[name] = false;
  const el = document.getElementById(`anim-${name}`);
  el.style.transform = 'scale(1)';
  setTimeout(() => runAnim(name), 100);
}

// Start all
for (const name of Object.keys(animations)) {
  runAnim(name);
}
</script>
</body>
</html>
