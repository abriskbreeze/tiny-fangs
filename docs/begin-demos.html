<!DOCTYPE html>
<html>
<head>
  <title>BEGIN! Animation Demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #ffd700; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .demo {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .demo h3 {
      color: #ffd700;
      margin: 0 0 10px 0;
    }
    .stage {
      background: #0d0d15;
      padding: 30px;
      border-radius: 4px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .demo pre {
      color: #ffd700;
      margin: 0;
      font-size: 16px;
      white-space: pre;
      line-height: 1.2;
    }
    .controls {
      margin-top: 10px;
    }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 5px 15px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>BEGIN! Animation Demos</h1>
  <p style="text-align:center;color:#888;">Sword slash style animations</p>
  <div class="grid" id="grid"></div>

<script>
const animations = {
  "1. Slash Reveal (L→R)": {
    frames: [
      { text: "\\", x: -60, delay: 50 },
      { text: "\\", x: -40, delay: 40 },
      { text: "B\\", x: -20, delay: 40 },
      { text: "BE\\", x: 0, delay: 40 },
      { text: "BEG\\", x: 0, delay: 40 },
      { text: "BEGI\\", x: 0, delay: 40 },
      { text: "BEGIN\\", x: 0, delay: 40 },
      { text: "BEGIN!\\", x: 0, delay: 40 },
      { text: "BEGIN! ", x: 0, delay: 60 },
      { text: "BEGIN!", x: 0, delay: 800, scale: 1.2 },
    ]
  },

  "2. X-Slash Cross": {
    frames: [
      { text: "    ╲    ╱\n     ╲  ╱\n      ╳\n     ╱  ╲\n    ╱    ╲", delay: 100 },
      { text: "   ╲      ╱\n    ╲    ╱\n     ╲  ╱\n      ╳\n     ╱  ╲", delay: 80 },
      { text: "      ╳\n     ╱ ╲\n    ╱   ╲\n\n   BEGIN!", delay: 80 },
      { text: "\n\n   BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n   BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "3. Impact Burst": {
    frames: [
      { text: "       *", delay: 50 },
      { text: "      ***", delay: 50 },
      { text: "     *****", delay: 50 },
      { text: "   * * * * *", delay: 50 },
      { text: " *  *  *  *  *", delay: 50 },
      { text: "*   BEGIN!   *", delay: 80 },
      { text: "    BEGIN!", delay: 100, scale: 1.2 },
      { text: "    BEGIN!", delay: 800, scale: 1.4 },
    ]
  },

  "4. Katana Draw": {
    frames: [
      { text: "━━━━━━━━━┓", delay: 60 },
      { text: "━━━━━━━━━╋━", delay: 50 },
      { text: "━━━━━━━━━╋━━━", delay: 50 },
      { text: "━━━━━━━━━╋━━━━━", delay: 50 },
      { text: "  BEGIN! ╋━━━━━━━", delay: 50 },
      { text: "  BEGIN!  ━━━━━━━━", delay: 80 },
      { text: "  BEGIN!", delay: 100, scale: 1.2 },
      { text: "  BEGIN!", delay: 800, scale: 1.3 },
    ]
  },

  "5. Diagonal Slash": {
    frames: [
      { text: "            ╱", delay: 40 },
      { text: "          ╱", delay: 40 },
      { text: "        ╱", delay: 40 },
      { text: "      ╱", delay: 40 },
      { text: "    ╱", delay: 40 },
      { text: "  ╱  BEGIN!", delay: 60 },
      { text: "╱    BEGIN!", delay: 60 },
      { text: "     BEGIN!", delay: 100, scale: 1.2 },
      { text: "     BEGIN!", delay: 800, scale: 1.4 },
    ]
  },

  "6. Shatter In": {
    frames: [
      { text: "B     E     G     I     N     !", delay: 80 },
      { text: "B    E    G    I    N    !", delay: 60 },
      { text: "B   E   G   I   N   !", delay: 50 },
      { text: "B  E  G  I  N  !", delay: 50 },
      { text: "B E G I N !", delay: 50 },
      { text: "BEGIN!", delay: 100, scale: 1.3 },
      { text: "BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "7. Double Slash": {
    frames: [
      { text: "╲          ╱", delay: 50 },
      { text: " ╲        ╱", delay: 40 },
      { text: "  ╲      ╱", delay: 40 },
      { text: "   ╲    ╱", delay: 40 },
      { text: "    ╲  ╱", delay: 40 },
      { text: "     ╳", delay: 60 },
      { text: "   BEGIN!", delay: 100, scale: 1.2 },
      { text: "   BEGIN!", delay: 800, scale: 1.4 },
    ]
  },

  "8. Vertical Cut": {
    frames: [
      { text: "     │\n     │\n     │\n     │\n     │", delay: 60 },
      { text: "     │\n     │\n  ───┼───\n     │\n     │", delay: 60 },
      { text: "     │\n  ───┼───\nBEGIN!\n  ───┼───\n     │", delay: 80 },
      { text: "  ───┼───\nBEGIN!\n  ───┼───", delay: 80 },
      { text: "\nBEGIN!", delay: 100, scale: 1.3 },
      { text: "\nBEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "9. Speed Lines": {
    frames: [
      { text: "──────────────────", delay: 40 },
      { text: "════──────────────", delay: 40 },
      { text: "B═══════──────────", delay: 40 },
      { text: "BE══════════──────", delay: 40 },
      { text: "BEG═════════════──", delay: 40 },
      { text: "BEGI══════════════", delay: 40 },
      { text: "BEGIN!════════════", delay: 60 },
      { text: "BEGIN!  ══════════", delay: 60 },
      { text: "BEGIN!", delay: 100, scale: 1.3 },
      { text: "BEGIN!", delay: 800, scale: 1.4 },
    ]
  },

  "10. Arc Slash": {
    frames: [
      { text: "        ╭──╮", delay: 50 },
      { text: "      ╭─╯  ╰─╮", delay: 50 },
      { text: "    ╭─╯      ╰─╮", delay: 50 },
      { text: "  ╭─╯  BEGIN!  ╰─╮", delay: 60 },
      { text: "╭─╯    BEGIN!    ╰─╮", delay: 60 },
      { text: "       BEGIN!", delay: 100, scale: 1.2 },
      { text: "       BEGIN!", delay: 800, scale: 1.4 },
    ]
  },

  "11. Typewriter Slash": {
    frames: [
      { text: "█", delay: 60 },
      { text: "B█", delay: 60 },
      { text: "BE█", delay: 60 },
      { text: "BEG█", delay: 60 },
      { text: "BEGI█", delay: 60 },
      { text: "BEGIN█", delay: 60 },
      { text: "BEGIN!█", delay: 80 },
      { text: "BEGIN! ", delay: 60 },
      { text: "BEGIN!", delay: 100, scale: 1.3 },
      { text: "BEGIN!", delay: 800, scale: 1.5 },
    ]
  },

  "12. Samurai Strike": {
    frames: [
      { text: "      │\n      │\n══════╪══════\n      │\n      │", delay: 80 },
      { text: "     ╲│╱\n      │\n══════╪══════\n      │\n     ╱│╲", delay: 60 },
      { text: "    ╲ │ ╱\n     ╲│╱\n══════╪══════\n     ╱│╲\n    ╱ │ ╲", delay: 60 },
      { text: "   ╲  │  ╱\n    ╲ │ ╱\n══BEGIN!══\n    ╱ │ ╲\n   ╱  │  ╲", delay: 80 },
      { text: "\n\n  BEGIN!", delay: 100, scale: 1.3 },
      { text: "\n\n  BEGIN!", delay: 800, scale: 1.5 },
    ]
  },
};

// Create demo grid
const grid = document.getElementById('grid');

for (const [name, anim] of Object.entries(animations)) {
  const demo = document.createElement('div');
  demo.className = 'demo';
  demo.innerHTML = `
    <h3>${name}</h3>
    <div class="stage">
      <pre id="anim-${name}"></pre>
    </div>
    <div class="controls">
      <button onclick="restartAnim('${name}')">Replay</button>
    </div>
  `;
  grid.appendChild(demo);
}

// Animation runners
const animStates = {};

async function runAnim(name) {
  const anim = animations[name];
  const el = document.getElementById(`anim-${name}`);
  animStates[name] = true;
  
  while (animStates[name]) {
    for (const frame of anim.frames) {
      if (!animStates[name]) break;
      el.textContent = frame.text;
      el.style.transform = `translateX(${frame.x || 0}px) scale(${frame.scale || 1})`;
      el.style.transition = frame.scale ? 'transform 0.15s ease-out' : 'none';
      await new Promise(r => setTimeout(r, frame.delay));
    }
    // Reset and pause before loop
    await new Promise(r => setTimeout(r, 1000));
    el.style.transform = 'scale(1)';
  }
}

function restartAnim(name) {
  animStates[name] = false;
  const el = document.getElementById(`anim-${name}`);
  el.style.transform = 'scale(1)';
  setTimeout(() => runAnim(name), 100);
}

// Start all
for (const name of Object.keys(animations)) {
  runAnim(name);
}
</script>
</body>
</html>
