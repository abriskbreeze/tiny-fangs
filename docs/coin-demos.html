      border-radius: 4px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      font-size: 12px;
      margin: 0;

    .controls {

    }
    button {

      color: #fff;
      border: 1px solid #555;
      padding: 5px 15px;
      cursor: pointer;
      border-radius: 4px;

// Create demo grid
const grid = document.getElementById('grid');

for (const [name, anim] of Object.entries(animations)) {
  const demo = document.createElement('div');
  demo.className = 'demo';
  demo.innerHTML = `
    <h3>${name}</h3>
    <pre id="coin-${name}"></pre>
    <div class="controls">
      <button onclick="restartAnim('${name}')">Restart</button>
    </div>
  `;
  grid.appendChild(demo);
}

// Animation runners
const animStates = {};

async function runAnim(name) {
  const anim = animations[name];
  const el = document.getElementById(`coin-${name}`);
  animStates[name] = true;
  
  while (animStates[name]) {
    for (const frame of anim.frames) {
      if (!animStates[name]) break;
      el.textContent = frame.art;
      await new Promise(r => setTimeout(r, frame.delay));
    }
    // Pause before loop
    await new Promise(r => setTimeout(r, 500));
  }
}

function restartAnim(name) {
  animStates[name] = false;
  setTimeout(() => runAnim(name), 100);
}

// Start all
for (const name of Object.keys(animations)) {
  runAnim(name);
}
